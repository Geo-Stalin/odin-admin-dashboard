<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Admin Dashboard</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="search-section">
                <label for="search"><img src="assets/icons/search-5-svgrepo-com.svg"></label>
                <input type="search" id="search">
            </div>
            <div class="user-controls">
                <img src="assets/icons/bell-ring-svgrepo-com.svg">
                <img src="assets/imgs/Batman.jpeg">
                <span>Geo Stalin</span>
            </div>
            <div class="greeting-section">
                <img src="assets/imgs/Batman.jpeg">
                <span> 
                    <p>Hi, there</p>
                    <p>Geo Stalin</p>
                </span>
                </div>
            <div class="header-action">
                <button>New</button>
                <button>Upload</button>
                <button>Share</button>
            </div>
        </div>
        <div class="sidebar">
            <div class="sidebar-header"><img src="assets/icons/dashboard-svgrepo-com.svg">Dashboard</div>
            <div class="primary-nav">
                <div id="home"><img src="assets/icons/home-svgrepo-com.svg">Home</div>
                <div id="profile"><img src="assets/icons/profile-round-1346-svgrepo-com.svg">Profile</div>
                <div id="messages"><img src="assets/icons/messages-3-svgrepo-com.svg">Messages</div>
                <div id="history"><img src="assets/icons/history-svgrepo-com.svg">History</div>
                <div id="task"><img src="assets/icons/tasks-svgrepo-com.svg">Task</div>
                <div id="community"><img src="assets/icons/users-2-svgrepo-com.svg">Community</div>
            </div>
            <div class="secondary-nav">
                <div id="settings"><img src="assets/icons/settings-svgrepo-com.svg">Settings</div>
                <div id="support"><img src="assets/icons/support-svgrepo-com.svg">Support</div>
                <div id="privacy"><img src="assets/icons/security-verified-svgrepo-com.svg">Privacy</div>
            </div>
        </div>
        <div class="main-content">
            <div class="project-section"></div>
            <div class="announcement-section"></div>
            <div class="trending-section"></div>
        </div>
    </div>
</body>
</html>
